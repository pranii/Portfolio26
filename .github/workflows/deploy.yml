# Baut die Seite bei jedem Push auf main und veroeffentlicht sie
# auf GitHub Pages.
#
# Einmalig noetig: Auf github.com unter Settings → Pages als Quelle
# "GitHub Actions" auswaehlen. Danach laeuft es von allein.

name: Seite bauen und veroeffentlichen

on:
  push:
    branches: [main]
  # Erlaubt einen Start von Hand im Actions-Tab.
  workflow_dispatch:

# Rechte, die der Workflow zum Veroeffentlichen braucht.
permissions:
  contents: read
  pages: write
  id-token: write

# Laeuft ein Deploy schon, wird es nicht abgebrochen, sondern abgewartet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Inhalte pruefen
        run: npm run check

      # BASE_PATH kommt aus der Pages-Konfiguration. Bei einem Repo namens
      # "portfolio" ist das "/portfolio/" — so muessen wir den Namen nicht
      # doppelt pflegen.
      - name: Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v5

      - name: Seite bauen
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages ausspielen
        id: deployment
        uses: actions/deploy-pages@v4
