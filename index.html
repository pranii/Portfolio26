<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta
      name="description"
      content="Portfolio — Film, Kommunikationsdesign, Creative Technology und Game."
    />
    <link rel="icon" href="data:," />
  </head>

  <body data-page="index">
    <div class="launcher" data-slot="launcher" aria-hidden="true">
      <img class="launcher__gif" src="/launcher/opener.gif" alt="" />
      <div class="launcher__text">
        <p class="launcher__title" data-slot="launcher-title">Portfolio</p>
        <p class="launcher__subtitle">Loading&hellip;</p>
      </div>
    </div>

    <div class="grain" aria-hidden="true"></div>

    <!-- Startbildschirm: fuellt genau das Fenster, scrollt nicht. -->
    <main class="home">
      <div class="home__status" aria-hidden="true">
        <span class="home__signal"></span>
        <span class="home__battery"></span>
      </div>

      <div class="home__center">
        <h1 class="home__title" data-fade data-slot="hero">Portfolio</h1>
        <p class="home__tags" data-fade="0.1" data-slot="role"></p>
      </div>

      <button
        class="home__call"
        type="button"
        data-slot="call"
        data-fade="0.2"
        data-cursor="Anrufen"
        data-t-cursor="menu.anrufen"
        data-t-label="menu.oeffnen"
        aria-haspopup="dialog"
      ></button>
    </main>

    <!-- Menue im Fenster. Beim Oeffnen wird die ganze Seite negativ. -->
    <dialog class="menu-window" data-slot="menu-window" aria-label="Menü">
      <button
        class="menu-window__close"
        type="button"
        data-menu="close"
        data-t-label="menu.schliessen"
      >
        ✕
      </button>
      <section class="phone">
        <div class="phone__screen" tabindex="0">
          <ul class="phone__list" data-slot="menu" aria-live="polite"></ul>
          <button
            class="phone__nav phone__nav--prev"
            type="button"
            data-menu="prev"
            data-t-label="menu.voriger"
          >
            <svg viewBox="0 0 7 7" fill="currentColor" aria-hidden="true">
              <rect x="3" y="0" width="1" height="1" />
              <rect x="2" y="1" width="2" height="1" />
              <rect x="1" y="2" width="6" height="1" />
              <rect x="0" y="3" width="7" height="1" />
              <rect x="1" y="4" width="6" height="1" />
              <rect x="2" y="5" width="2" height="1" />
              <rect x="3" y="6" width="1" height="1" />
            </svg>
          </button>
          <button
            class="phone__nav phone__nav--next"
            type="button"
            data-menu="next"
            data-t-label="menu.naechster"
          >
            <svg viewBox="0 0 7 7" fill="currentColor" aria-hidden="true">
              <rect x="3" y="0" width="1" height="1" />
              <rect x="2" y="1" width="2" height="1" />
              <rect x="1" y="2" width="6" height="1" />
              <rect x="0" y="3" width="7" height="1" />
              <rect x="1" y="4" width="6" height="1" />
              <rect x="2" y="5" width="2" height="1" />
              <rect x="3" y="6" width="1" height="1" />
            </svg>
          </button>
        </div>
      </section>
    </dialog>

    <script type="module" src="/src/scripts/main.js"></script>
  </body>
</html>
